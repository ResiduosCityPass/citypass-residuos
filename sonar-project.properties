# Analisis unico del repositorio: API NestJS y cliente React/Vite.
sonar.projectKey=ResiduosCityPass_citypass-residuos2
sonar.organization=residuoscitypass-1
sonar.sources=backend/src,frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,backend/src/**/*.spec.ts,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/**/*.spec.js,frontend/src/**/*.spec.jsx,frontend/src/test/**
# Dos reportes del backend, no uno. Los unitarios no tocan los repositorios ni
# las consultas: eso lo ejercitan los tests de integracion contra PostgreSQL, y
# sin este segundo reporte esa cobertura no se mide y los archivos aparecen como
# si no estuvieran probados. Medidos, los repositorios estan entre 90% y 100%.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,backend/coverage-e2e/lcov.info,frontend/coverage/lcov.info

# Archivos sin logica que testear: son declaraciones y cableado. Es la misma
# lista que ya excluye `collectCoverageFrom` en package.json; tenerla en un solo
# lado y no en el otro hacia que el porcentaje de Sonar no coincidiera con el de
# los tests, y que cualquier modulo nuevo bajara la cobertura por existir.
#
# Las migraciones van aca por otro motivo: su `down()` no corre nunca en los
# tests -y no deberia-, asi que la mitad del archivo figura sin cubrir por
# diseño.
sonar.coverage.exclusions=**/*.module.ts,**/*.entity.ts,**/*.dto.ts,**/main.ts,**/data-source.ts,**/scripts/**,**/migrations/**,backend/src/config/**,frontend/src/mocks/**

sonar.sourceEncoding=UTF-8
