# IaC del modulo de Residuos en Render.
# Crear el Blueprint desde este archivo y apuntar los servicios a main.

previews:
  generation: off

services:
  - type: web
    name: citypass-residuos-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: citypass-residuos-db
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: DB_MIGRATIONS_RUN
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: JWT_ISSUER
        value: https://idp.citypass.local
      - key: JWT_AUDIENCE
        value: citypass-residuos-api
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        fromService:
          name: citypass-residuos-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: EVENT_BUS_DRIVER
        value: inmemory

  - type: web
    name: citypass-residuos-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          name: citypass-residuos-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_API_PREFIX
        value: api/v1
      - key: VITE_USE_MOCKS
        value: "false"
      - key: VITE_SIMULAR_GPS
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: citypass-residuos-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    databaseName: residuos
    user: citypass
    ipAllowList: []
