# IaC del modulo de Residuos en Render.
# Crear el Blueprint desde este archivo y apuntar los servicios a main.

previews:
  generation: off

services:
  - type: web
    name: citypass-residuos-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # El workflow CI dispara el deploy por hook solo despues de que todos los
    # chequeos pasan. Render no reintenta detectar el push por su cuenta.
    autoDeployTrigger: off
    healthCheckPath: /api/v1/health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: citypass-residuos-db-2026-10
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: DB_MIGRATIONS_RUN
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: AUTH_MODE
        value: federated
      - key: JWT_ISSUER
        value: https://idp.citypass.local
      - key: JWT_ISSUER_CHOFERES
        value: citypass-residuos-choferes
      - key: JWT_AUDIENCE
        value: citypass-residuos-api
      - key: JWT_JWKS_URL
        value: https://api.citypass-login.pp.ua/.well-known/jwks.json
      - key: JWT_MODULE
        value: residuos
      - key: JWT_ADMIN_GROUPS
        value: administrador
      - key: JWT_OPERATOR_GROUPS
        value: operador,delegados
      - key: JWT_DRIVER_GROUPS
        value: chofer
      # HS256 corresponde solo a las credenciales internas del chofer.
      # Los tokens humanos del IdP se verifican con RS256/JWKS.
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        fromService:
          name: citypass-residuos-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: EVENT_BUS_DRIVER
        value: platform
      - key: CLIMA_SIMULADOR_HABILITADO
        value: "false"
      - key: EDA_GATEWAY_URL
        value: https://test.citypass.mrfranco.net.ar/api/v1
      - key: EDA_AUTH_URL
        value: https://api.citypass-login.pp.ua
      - key: EDA_TOKEN_ISSUER
        value: https://idp.citypass.local
      - key: EDA_CLIENT_ID
        value: grupo6
      - key: EDA_CLIENT_SECRET
        sync: false
      - key: EDA_NAMESPACE
        value: com.citypass.residuos
      - key: EDA_CONSUMER_ENABLED
        value: "true"
      - key: EDA_CLIMA_SIMULACRO_ENABLED
        value: "false"
      - key: EDA_KAFKA_BROKERS
        value: test.citypass.mrfranco.net.ar:9092
      - key: EDA_KAFKA_SSL
        value: "true"
      # Separado del consumidor de la demo local.
      - key: EDA_KAFKA_GROUP_ID
        value: com.citypass.residuos.residuos-clima-v1
      - key: EDA_KAFKA_FROM_BEGINNING
        value: "true"

  - type: web
    name: citypass-residuos-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Ver comentario equivalente en el servicio API.
    autoDeployTrigger: off
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          name: citypass-residuos-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_API_PREFIX
        value: api/v1
      - key: VITE_AUTH_MODE
        value: federated
      - key: VITE_IDP_URL
        value: https://api.citypass-login.pp.ua
      - key: VITE_IDP_CLIENT_ID
        value: citypass-residuos-web
      - key: VITE_USE_MOCKS
        value: "false"
      - key: VITE_SIMULAR_GPS
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: citypass-residuos-db-2026-10
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    databaseName: residuos_gcyc
    user: citypass
    ipAllowList: []
