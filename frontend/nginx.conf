server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Misma ruta que el rewrite de Render y el proxy de Vite. El resolver de
  # Docker se consulta al pedir el tablero, sin impedir servir la SPA sola.
  location ^~ /api/v1/metricas/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $residuos_api http://api:3000;
    proxy_pass $residuos_api$request_uri;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_read_timeout 70s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
