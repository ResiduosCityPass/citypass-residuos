# Entorno local del modulo de Residuos — Squad 4
# Uso:  docker compose -f infra/docker-compose.yml up -d --build
#
# Duenio: Ramiro (DevOps).

name: citypass-residuos

services:
  api:
    build: ../backend
    container_name: citypass-residuos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      API_PREFIX: api/v1
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: citypass
      DB_PASSWORD: citypass
      DB_NAME: residuos
      DB_SYNCHRONIZE: 'false'
      DB_MIGRATIONS_RUN: 'true'
      JWT_SECRET: dev-only-cambiar-en-produccion
      JWT_ISSUER: https://idp.citypass.local
      JWT_AUDIENCE: citypass-residuos-api
      JWT_ALGORITHM: HS256
      DB_SSL: 'false'
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      EVENT_BUS_DRIVER: inmemory
      RABBITMQ_URL: amqp://citypass:citypass@rabbitmq:5672
      EVENT_BUS_EXCHANGE: citypass.events
    ports:
      - '3000:3000'

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: http://localhost:3000/api/v1
        VITE_USE_MOCKS: 'false'
        VITE_SIMULAR_GPS: 'false'
    container_name: citypass-residuos-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'

  postgres:
    image: postgres:16-alpine
    container_name: citypass-residuos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: citypass
      POSTGRES_PASSWORD: citypass
      POSTGRES_DB: residuos
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U citypass -d residuos']
      interval: 10s
      timeout: 5s
      retries: 5

  # Se activa en el Sprint 2, cuando pasemos el driver de eventos de
  # inmemory a rabbitmq para validar el flujo asincronico end-to-end (ADR-003).
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: citypass-residuos-bus
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: citypass
      RABBITMQ_DEFAULT_PASS: citypass
    ports:
      - '5672:5672'
      - '15672:15672' # consola web: http://localhost:15672
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
